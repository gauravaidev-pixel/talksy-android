name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Print signing SHA-1 (use this in Google Cloud Console)
        run: gradle :app:signingReport --no-daemon

      - name: Build APKs (release + debug)
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: talksy-apks
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: talksy-latest
          name: Talksy - latest APK
          body: |
            Talksy Android app.
            - app-release.apk  : recommended (R8 optimised, smoother, smaller)
            - app-debug.apk    : debug build
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
